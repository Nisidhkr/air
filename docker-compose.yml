# Air unified platform — full production-shaped stack.
# ONE backend container; everything else is infrastructure it talks to.
#   docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9090:9090"
    environment:
      PORT: 9090
      # ── ONE database ──
      DATABASE_URL: jdbc:postgresql://postgres:5432/air
      DATABASE_USER: air
      DATABASE_PASSWORD: air-dev-password
      # ── ONE storage layer (local | minio | s3) ──
      FYLO_STORAGE: minio
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: air
      S3_ACCESS_KEY: air
      S3_SECRET_KEY: air-dev-password
    volumes:
      - air-data:/root/.peerlink
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Live P2P shares bind dynamic high ports; expose them for direct mode.
    expose:
      - "49152-65535"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:9090
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: air
      POSTGRES_USER: air
      POSTGRES_PASSWORD: air-dev-password
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Schema applied on first boot; use Flyway in CI/CD for upgrades.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: air
      MINIO_ROOT_PASSWORD: air-dev-password
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 air air-dev-password &&
      mc mb --ignore-existing local/air
      "

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: air-dev-password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  air-data:
  pg-data:
  minio-data:
  prom-data:
  grafana-data:
