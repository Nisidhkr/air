apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fylo-backend-hpa
  namespace: fylo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fylo-backend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
