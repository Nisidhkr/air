apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fylo
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - { containerPort: 6379 }
          volumeMounts:
            - { name: redis-data, mountPath: /data }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: fylo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
