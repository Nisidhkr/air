apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-backend
  namespace: air
  labels: { app: air-backend }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: air-backend }
  template:
    metadata:
      labels: { app: air-backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: backend
          image: ghcr.io/air/backend:latest
          ports:
            - { containerPort: 9090, name: http }
            - { containerPort: 9091, name: websocket }
          envFrom:
            - configMapRef: { name: air-backend-config }
            - secretRef: { name: air-backend-secrets }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Graceful drain: let the LB stop routing before shutdown.
                command: ["sh", "-c", "sleep 10"]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {} # durable state lives in Postgres/MinIO/Redis
