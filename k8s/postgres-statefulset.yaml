apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fylo
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: fylo }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fylo-backend-secrets, key: DATABASE_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fylo-backend-secrets, key: DATABASE_PASSWORD }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fylo"]
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests: { storage: 50Gi }
