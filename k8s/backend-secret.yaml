apiVersion: v1
kind: Secret
metadata:
  name: fylo-backend-secrets
  namespace: fylo
type: Opaque
data:
  DATABASE_URL: <base64 jdbc:postgresql://postgres-service:5432/fylo>
  DATABASE_USER: <base64>
  DATABASE_PASSWORD: <base64>
  JWT_SECRET: <base64 32 random bytes>
  S3_ACCESS_KEY: <base64>
  S3_SECRET_KEY: <base64>
