# Prometheus scrape config for the Fylo stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus-alerts.yml"

scrape_configs:
  - job_name: fylo-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:9090"]
        labels:
          service: fylo
  # With N replicas behind a load balancer, list each instance here or use
  # DNS service discovery:
  # - job_name: fylo-backend-fleet
  #   dns_sd_configs:
  #     - names: ["tasks.backend"]   # Docker Swarm / Compose DNS
  #       type: A
  #       port: 9090
