# Air CI/CD — build, test, package, image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml || true

      - name: Upload shaded jar
        uses: actions/upload-artifact@v4
        with:
          name: air-backend
          path: target/p2p-1.0-SNAPSHOT.jar

  schema-check:
    # The SQL must always apply cleanly to a blank PostgreSQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fylo
          POSTGRES_USER: fylo
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fylo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          for f in db/migrations/V*.sql; do
            echo "Applying $f"
            PGPASSWORD=ci psql -h localhost -U fylo -d fylo -v ON_ERROR_STOP=1 -f "$f"
          done

  docker-image:
    needs: [build-test, schema-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t air-backend:${{ github.sha }} .
      # Push step (uncomment and add secrets when a registry exists):
      # - name: Push
      #   run: |
      #     echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #     docker tag air-backend:${{ github.sha }} ghcr.io/${{ github.repository }}/air-backend:latest
      #     docker push ghcr.io/${{ github.repository }}/air-backend:latest
